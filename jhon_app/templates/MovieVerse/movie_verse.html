<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MovieVerse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;600;700&display=swap">
<style>
:root{--bg:#07060f;--panel:#12112a;--line:#2a2850;--text:#f1efff;--mut:#8b88b5;--cy:#00e5ff;--pk:#ff2bd6;--lime:#b6ff3b;--danger:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 400px at 85% -10%,#3a0f3f55,transparent),var(--bg);color:var(--text);font-family:'Exo 2',system-ui,sans-serif;display:flex}
aside{width:220px;border-right:1px solid var(--line);padding:24px 18px;flex-shrink:0}
.logo{font-family:Orbitron,sans-serif;font-weight:800;font-size:22px;color:var(--cy);text-shadow:0 0 12px var(--cy);margin:0 0 36px 6px}
.logo span{color:var(--pk);text-shadow:0 0 12px var(--pk)}
.nav{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--mut);font:600 15px 'Exo 2',sans-serif;padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.nav.on{color:var(--cy);border-color:var(--cy);background:#00e5ff10;box-shadow:0 0 14px #00e5ff30}
main{flex:1;padding:40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-family:Orbitron,sans-serif;font-weight:800;font-size:44px;margin:0;color:#ffd6f6;text-shadow:0 0 6px var(--pk),0 0 22px var(--pk)}
.sub{color:var(--mut);margin:6px 0 0}.sub b{color:var(--cy)}
.btn{font:700 14px 'Exo 2',sans-serif;border-radius:10px;padding:11px 18px;cursor:pointer;background:transparent;color:var(--pk);border:1px solid var(--pk);box-shadow:0 0 14px #ff2bd640}
.btn:hover{background:#ff2bd618}
.btn.cy{color:var(--cy);border-color:var(--cy);box-shadow:0 0 14px #00e5ff40}
.btn.cy:hover{background:#00e5ff18}
.btn.dg{color:var(--danger);border-color:var(--danger);box-shadow:0 0 14px #ff4d6d40}
.btn.dg:hover{background:#ff4d6d18}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:none}
.btn.ghost{color:var(--mut);border-color:var(--line);box-shadow:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:720px}
th{color:var(--mut);font-weight:600;font-size:12px;letter-spacing:.12em;text-align:left;padding:8px 14px}
td{padding:14px;background:#ffffff08;vertical-align:middle}
td:first-child{border-radius:12px 0 0 12px;color:var(--mut)}td:last-child{border-radius:0 12px 12px 0}
.name{font-weight:700}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid var(--cy);color:var(--cy);font-size:13px;font-weight:700}
.pill.st{border-color:var(--lime);color:var(--lime)}.pill.st.Ongoing{border-color:var(--cy);color:var(--cy)}.pill.st.Planned{border-color:var(--pk);color:var(--pk)}
.rate{display:flex;align-items:center;gap:12px}.bar{width:120px;height:6px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk))}
.act{display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--mut);padding:36px 0!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.stat b{display:block;font:800 32px Orbitron,sans-serif;color:var(--cy);text-shadow:0 0 12px #00e5ff80}.stat span{color:var(--mut)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--cy);border-radius:18px;padding:26px;width:min(440px,92vw);box-shadow:0 0 40px #00e5ff30}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
dialog h2{font:800 20px Orbitron,sans-serif;margin:0 0 18px;color:var(--cy)}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 5px}
input,select{width:100%;background:#0b0a1c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input:focus,select:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:760px){body{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px}.logo{margin:0 12px 0 0}.nav{width:auto;margin:0}main{padding:22px 16px}h1{font-size:32px}}
</style>
</head>
<body>
<aside>
  <p class="logo">Movie<span>Verse</span></p>
  <button class="nav" data-v="dash">Dashboard</button>
  <button class="nav on" data-v="list">Movie List</button>
</aside>
<main>
  <div class="head">
    <div><h1 id="title">Movie List</h1><p class="sub" id="sub"></p></div>
    <button class="btn" id="add">+ Add movie</button>
  </div>
  <div id="view"></div>
</main>

<dialog id="form">
  <h2 id="ftitle">Add movie</h2>
  <label for="fname">Name</label><input id="fname" maxlength="80">
  <div class="row">
    <div><label for="ftype">Type</label><select id="ftype"><option>Movie</option><option>Series</option><option>Anime</option></select></div>
    <div><label for="fstatus">Status</label><select id="fstatus"><option>Complete</option><option>Ongoing</option><option>Planned</option></select></div>
  </div>
  <label for="fgenre">Genre</label><input id="fgenre" maxlength="40">
  <label for="frating">Rating (0 to 10)</label><input id="frating" type="number" min="0" max="10" step="0.1">
  <div class="foot"><button class="btn ghost" id="fcancel">Cancel</button><button class="btn cy" id="fsave">Save changes</button></div>
</dialog>

<dialog id="confirm">
  <h2 style="color:var(--danger)">Delete movie?</h2>
  <p id="ctext" style="color:var(--mut);margin:0"></p>
  <div class="foot"><button class="btn ghost" id="ccancel">Cancel</button><button class="btn dg" id="cok">Delete</button></div>
</dialog>

<script>
const KEY='movieverse:v1';
let movies=[{id:1,name:'Ongbak',type:'Movie',genre:'Violence',status:'Complete',rating:8.5}];
try{const s=localStorage.getItem(KEY);if(s)movies=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(movies))}catch(e){}};
let view='list',editId=null,delId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('title').textContent=view==='list'?'Movie List':'Dashboard';
  $('sub').innerHTML=`<b>${movies.length}</b> ${movies.length===1?'title':'titles'} in your collection`;
  if(view==='dash'){
    const avg=movies.length?(movies.reduce((a,m)=>a+m.rating,0)/movies.length).toFixed(1):'0.0';
    const done=movies.filter(m=>m.status==='Complete').length;
    const top=movies.reduce((a,m)=>!a||m.rating>a.rating?m:a,null);
    $('view').innerHTML=`<div class="stats"><div class="stat"><b>${movies.length}</b><span>Total titles</span></div><div class="stat"><b>${done}</b><span>Completed</span></div><div class="stat"><b>${avg}</b><span>Average rating</span></div><div class="stat"><b style="font-size:20px">${top?esc(top.name):'None'}</b><span>Top rated</span></div></div>`;
    return;
  }
  const rows=movies.map(m=>`<tr>
    <td>${m.id}</td><td class="name">${esc(m.name)}</td>
    <td><span class="pill">${esc(m.type)}</span></td><td>${esc(m.genre)}</td>
    <td><span class="pill st ${esc(m.status)}">${esc(m.status)}</span></td>
    <td><div class="rate"><div class="bar"><i style="width:${m.rating*10}%"></i></div><b>${m.rating.toFixed(1)}</b></div></td>
    <td><div class="act"><button class="btn cy sm" data-edit="${m.id}">Edit</button><button class="btn dg sm" data-del="${m.id}">Delete</button></div></td></tr>`).join('');
  $('view').innerHTML=`<div class="card"><table><thead><tr><th>ID</th><th>NAME</th><th>TYPE</th><th>GENRE</th><th>STATUS</th><th>RATING</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No movies yet. Select Add movie to start your collection.</td></tr>'}</tbody></table></div>`;
}

function openForm(id){
  editId=id;const m=movies.find(x=>x.id===id);
  $('ftitle').textContent=m?'Edit movie':'Add movie';
  $('fname').value=m?m.name:'';$('ftype').value=m?m.type:'Movie';
  $('fstatus').value=m?m.status:'Complete';$('fgenre').value=m?m.genre:'';
  $('frating').value=m?m.rating:'';
  $('form').showModal();$('fname').focus();
}
$('add').onclick=()=>openForm(null);
$('fcancel').onclick=()=>$('form').close();
$('fsave').onclick=()=>{
  const name=$('fname').value.trim();
  if(!name){$('fname').focus();return}
  const r=Math.min(10,Math.max(0,parseFloat($('frating').value)||0));
  const data={name,type:$('ftype').value,status:$('fstatus').value,genre:$('fgenre').value.trim()||'Unknown',rating:r};
  if(editId!==null){movies=movies.map(m=>m.id===editId?{...m,...data}:m)}
  else{movies.push({id:movies.reduce((a,m)=>Math.max(a,m.id),0)+1,...data})}
  save();$('form').close();render();
};
$('view').addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
  if(ed)openForm(+ed.dataset.edit);
  if(dl){delId=+dl.dataset.del;const m=movies.find(x=>x.id===delId);$('ctext').textContent=`"${m.name}" will be removed from your collection.`;$('confirm').showModal()}
});
$('ccancel').onclick=()=>$('confirm').close();
$('cok').onclick=()=>{movies=movies.filter(m=>m.id!==delId);save();$('confirm').close();render()};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
render();
</script>
</body>
</html>
